name: publish

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      # Only semver-style release tags (e.g. `v0.1.0`, `v0.1.0+2`).
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  validate:
    name: Validate packages
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          cache: true

      - name: 🔎 Analyze
        run: |
          for pkg in pipecat_smart_turn_platform_interface pipecat_smart_turn_android pipecat_smart_turn_ios pipecat_smart_turn_linux pipecat_smart_turn_macos pipecat_smart_turn_web pipecat_smart_turn_windows pipecat_smart_turn; do
            echo "==> flutter analyze: $pkg"
            (cd "$pkg" && flutter analyze)
          done

      - name: 🧪 Test
        run: |
          for pkg in pipecat_smart_turn_platform_interface pipecat_smart_turn_android pipecat_smart_turn_ios pipecat_smart_turn_linux pipecat_smart_turn_macos pipecat_smart_turn_web pipecat_smart_turn_windows pipecat_smart_turn; do
            echo "==> flutter test: $pkg"
            (cd "$pkg" && flutter test)
          done

      - name: 📦 Dry-run publish
        run: |
          chmod +x scripts/publish_packages.sh
          PUBLISH_DRY_RUN=1 scripts/publish_packages.sh

  publish:
    name: Publish to pub.dev
    # Only publish after validation passes.
    needs: validate
    # Keyless OIDC publishing: setup-dart requests an OIDC token from GitHub
    # (audience https://pub.dev) and exports it as PUB_TOKEN; pub.dev
    # cryptographically verifies it against each package admin configuration
    # (tag pattern `v{{version}}`). No secrets or manual approval are involved.
    permissions:
      id-token: write # Required for the OIDC token exchange with pub.dev.
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      # Provisions the pub.dev OIDC token as PUB_TOKEN (needs id-token: write).
      - name: 🐦 Setup Dart (provision OIDC token)
        uses: dart-lang/setup-dart@v1

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          cache: true

      - name: 🚀 Publish packages (topological order)
        run: |
          chmod +x scripts/publish_packages.sh
          scripts/publish_packages.sh