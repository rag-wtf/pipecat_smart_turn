name: Pana Workflow

on:
  workflow_call:
    inputs:
      min_score:
        required: false
        type: number
        default: 120
      pana_version:
        required: false
        type: string
      runs_on:
        required: false
        type: string
        default: "ubuntu-latest"
      working_directory:
        required: false
        type: string
        default: "."

jobs:
  build:
    defaults:
      run:
        working-directory: ${{inputs.working_directory}}

    runs-on: ${{inputs.runs_on}}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          cache: true

      - name: 📦 Install Pana
        run: flutter pub global activate pana ${{inputs.pana_version}}

      - name: 📊 Verify Pana Score
        run: |
          PROJECT_ROOT=$(git rev-parse --show-toplevel)
          PANA_OUTPUT=$(pana --json --project-root "$PROJECT_ROOT" .)
          SCORE=$(echo "$PANA_OUTPUT" | grep -o '"grantedPoints":[0-9]*' | head -1 | cut -d':' -f2 || true)
          if [ -z "$SCORE" ]; then
            PANA_RAW=$(pana --project-root "$PROJECT_ROOT" .)
            SCORE=$(echo "$PANA_RAW" | sed -n "s/.*Points: \([0-9]*\)\/.*/\1/p" | head -1)
          fi
          SCORE=${SCORE:-0}
          echo "Pana Granted Points: $SCORE"
          if [ "$SCORE" -lt "${{inputs.min_score}}" ]; then
            echo "The minimum score of ${{inputs.min_score}} was not met (got $SCORE)!"
            exit 1
          fi
