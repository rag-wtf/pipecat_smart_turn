name: pipecat_smart_turn_platform_interface

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/pipecat_smart_turn_platform_interface.yaml"
      - "pipecat_smart_turn_platform_interface/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pipecat_smart_turn_platform_interface.yaml"
      - "pipecat_smart_turn_platform_interface/**"

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: 3.41.1
      working_directory: pipecat_smart_turn_platform_interface

  pana:
    uses: ./.github/workflows/pana.yaml
    with:
      working_directory: pipecat_smart_turn_platform_interface

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'
      - name: Install Dependencies
        working-directory: pipecat_smart_turn_platform_interface
        run: flutter pub get
      - name: Test Web Compilation
        working-directory: pipecat_smart_turn_platform_interface
        run: flutter test --platform chrome
