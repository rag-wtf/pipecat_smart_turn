name: pipecat_smart_turn

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/pipecat_smart_turn.yaml"
      - "pipecat_smart_turn/**"
      - "pipecat_smart_turn_platform_interface/**"
      - "pipecat_smart_turn_android/**"
      - "pipecat_smart_turn_ios/**"
      - "pipecat_smart_turn_linux/**"
      - "pipecat_smart_turn_macos/**"
      - "pipecat_smart_turn_web/**"
      - "pipecat_smart_turn_windows/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pipecat_smart_turn.yaml"
      - "pipecat_smart_turn/**"
      - "pipecat_smart_turn_platform_interface/**"
      - "pipecat_smart_turn_android/**"
      - "pipecat_smart_turn_ios/**"
      - "pipecat_smart_turn_linux/**"
      - "pipecat_smart_turn_macos/**"
      - "pipecat_smart_turn_web/**"
      - "pipecat_smart_turn_windows/**"

jobs:
  verify-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify third-party binary and model checksums
        run: ./scripts/verify_binaries.sh

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      includes: |
        **/*.md
        !brick/**/*.md
        !.*/**
      modified_files_only: false

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: 3.41.1
      working_directory: pipecat_smart_turn

  pana:
    uses: ./.github/workflows/pana.yaml
    with:
      working_directory: pipecat_smart_turn

  android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pipecat_smart_turn/example

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          cache: true

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test/app_test.dart -d emulator-5554
          working-directory: pipecat_smart_turn/example

  ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: pipecat_smart_turn/example

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          cache: true

      - name: Start Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | grep -o -E '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "Simulator UDID: $UDID"
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Prebuild iOS App
        run: flutter build ios --simulator --debug

      - name: E2E Tests
        run: flutter test integration_test/app_test.dart -d "$SIMULATOR_UDID"

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipecat_smart_turn/example

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          cache: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev pkg-config cmake ninja-build libblkid-dev liblzma-dev

      - name: E2E Tests
        run: xvfb-run flutter test integration_test/app_test.dart -d linux

  macos:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: pipecat_smart_turn/example

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          cache: true

      - name: E2E Tests
        run: flutter test integration_test/app_test.dart -d macos

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pipecat_smart_turn/example

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          cache: true

      - name: E2E Tests
        run: |
          chromedriver --port=4444 &
          sleep 2
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d web-server

  windows:
    runs-on: windows-2022

    defaults:
      run:
        working-directory: pipecat_smart_turn/example

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          cache: true

      - name: E2E Tests
        run: flutter test integration_test/app_test.dart -d windows
