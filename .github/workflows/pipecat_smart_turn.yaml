name: pipecat_smart_turn

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/pipecat_smart_turn.yaml"
      - "pipecat_smart_turn/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pipecat_smart_turn.yaml"
      - "pipecat_smart_turn/**"

jobs:
  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      includes: |
        **/*.md
        !brick/**/*.md
        .*/**/*.md
      modified_files_only: false

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: 3.41.1
      working_directory: pipecat_smart_turn

  pana:
    uses: ./.github/workflows/pana.yaml
    with:
      working_directory: pipecat_smart_turn


  android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pipecat_smart_turn/example

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "11"

      - uses: subosito/flutter-action@v2

      - name: AVD Cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-29

      - name: Cache AVD Snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: flutter test integration_test/app_test.dart
          working-directory: pipecat_smart_turn/example

  ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: pipecat_smart_turn/example

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2

      - name: Start Simulator
        # Start an iPhone simulator
        run: |
          UDID=$(xcrun xctrace list devices | grep "^iPhone" | awk '{gsub(/[()]/,""); print $NF}' | head -n 1)
          echo $UDID
          xcrun simctl boot "${UDID:?No Simulator with this name found}"

      - name: E2E Tests
        run: flutter test integration_test/app_test.dart -d iPhone

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipecat_smart_turn/example

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev pkg-config cmake ninja-build libblkid-dev liblzma-dev

      - name: E2E Tests
        run: xvfb-run flutter test integration_test/app_test.dart -d linux

  macos:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: pipecat_smart_turn/example

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2

      - name: E2E Tests
        run: flutter test integration_test/app_test.dart -d macos

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pipecat_smart_turn/example

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2

      - name: E2E Tests
        run: xvfb-run flutter test integration_test/app_test.dart -d chrome

  windows:
    runs-on: windows-2022

    defaults:
      run:
        working-directory: pipecat_smart_turn/example

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2

      - name: E2E Tests
        run: flutter test integration_test/app_test.dart -d windows
